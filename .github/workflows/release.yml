name: Production Release & Notarization

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Submit to Apple Notary Service'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-sign-notarize:
    name: Build, Sign, Package & Notarize
    runs-on: macos-15
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --find notarytool
          xcrun --find stapler

      - name: Setup Keychain for Developer ID Signing
        if: env.DEVELOPER_ID_CERTIFICATE_BASE64 != ''
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp_keychain_pass_123' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo "${DEVELOPER_ID_CERTIFICATE_BASE64}" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "${KEYCHAIN_PATH}" \
            -P "${DEVELOPER_ID_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | sed -e 's/"//g')
          rm -f $RUNNER_TEMP/certificate.p12
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> $GITHUB_ENV

      - name: Build Production Distribution
        run: |
          ./scripts/build_distribution.sh

      - name: Package Release (DMG & PKG)
        run: |
          ./scripts/package_release.sh

      - name: Notarize & Staple
        if: ${{ github.event.inputs.notarize != false }}
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '776DCH59C8' }}
        run: |
          if [ -n "${APPLE_API_KEY_BASE64}" ] && [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER}" ]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "${APPLE_API_KEY_BASE64}" | base64 --decode > "${API_KEY_PATH}"
            export APPLE_API_KEY_PATH="${API_KEY_PATH}"
            ./scripts/notarize_release.sh
            rm -f "${API_KEY_PATH}"
          else
            echo "Notarization API secrets not configured. Running dry credential check..."
            ./scripts/notarize_release.sh || true
          fi

      - name: Gatekeeper Local Assessment
        run: |
          if [ -f "build/Dist/Latch.dmg" ]; then
            echo "Assessing Latch.dmg with spctl..."
            spctl --assess --type open --context context:primary-signature build/Dist/Latch.dmg || true
          fi
          if [ -f "build/Dist/Latch.pkg" ]; then
            echo "Assessing Latch.pkg with spctl..."
            spctl --assess --type install build/Dist/Latch.pkg || true
          fi

      - name: Sign Sparkle Update & Update Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -n "${SPARKLE_PRIVATE_KEY}" ] && [ -f "build/Dist/Latch.dmg" ]; then
            echo "Locating sign_update tool..."
            SIGN_TOOL=$(find ~/Library/Developer/Xcode/DerivedData -name "sign_update" -type f 2>/dev/null | head -n 1 || true)
            if [ -n "${SIGN_TOOL}" ]; then
              echo "${SPARKLE_PRIVATE_KEY}" > /tmp/sparkle_ed.key
              SIGN_OUT=$("${SIGN_TOOL}" --ed-key-file /tmp/sparkle_ed.key build/Dist/Latch.dmg)
              echo "Sparkle signature: ${SIGN_OUT}"
              rm -f /tmp/sparkle_ed.key
            fi
          else
            echo "Sparkle private key not provided in secrets or Latch.dmg missing."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/Dist/Latch.dmg
            build/Dist/Latch.pkg
            appcast.xml
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
